<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" sizes="256x256" href="./agromedconnect-favicon.png?v=6" />
    <link rel="icon" type="image/x-icon" sizes="any" href="./favicon.ico?v=6" />
    <link rel="shortcut icon" type="image/x-icon" href="./favicon.ico?v=6" />
    <link rel="apple-touch-icon" sizes="256x256" href="./agromedconnect-favicon.png?v=6" />
    <link rel="manifest" href="./site.webmanifest?v=6" />
    <meta name="application-name" content="AgroMedConnect" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgroMedConnect — Admin</title>

    <script type="text/javascript">

      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
